[project]
name = "mycar-api"
version = "0.1.0"
description = "API for vehicle management: vehicles, events, maintenance and alerts"
authors = [{ name = "mycar-api", email = "andre.barbosa.076@ufrn.edu.br" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.115,<0.116)",
    "uvicorn[standard] (>=0.32,<0.33)",
    "pydantic (>=2.9,<3.0)",
    "pydantic-settings (>=2.5,<3.0)",
    "sqlalchemy[asyncio] (>=2.0.35,<3.0)",
    "asyncpg (>=0.30,<0.31)",
    "alembic (>=1.13.3,<2.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
ruff = "^0.7.0"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
